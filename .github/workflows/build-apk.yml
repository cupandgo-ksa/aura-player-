name: Build AURA APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build uploaded glass interface for offline Android assets
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build
          mkdir -p ../app/src/main/assets
          cp -R dist/. ../app/src/main/assets/
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-Player-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.auraplayer.offline android.permission.READ_MEDIA_AUDIO
            adb shell pm grant com.auraplayer.offline android.permission.READ_MEDIA_VIDEO
            adb shell am start -n com.auraplayer.offline/.GlassActivity
            sleep 12
            adb exec-out screencap -p > glass-smoke.png
            adb logcat -d -s AndroidRuntime:E chromium:E AURA_WEB:V > glass-smoke.log
            if grep -qE 'FATAL EXCEPTION|Root length 0|Root length -1|Asset failed|WebView error' glass-smoke.log; then cat glass-smoke.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AURA-Emulator-Screen
          path: |
            glass-smoke.png
            glass-smoke.log
          if-no-files-found: ignore
