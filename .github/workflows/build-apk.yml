name: Build native music APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: A-S-Native-Music-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Free disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/lib/android/sdk/ndk
          df -h /
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator playback smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disk-size: 1024M
          ram-size: 1536M
          heap-size: 256M
          sdcard-path-or-size: 64M
          emulator-boot-timeout: 480
          pre-emulator-launch-script: sed -i 's/^disk\.dataPartition\.size=.*/disk.dataPartition.size=1024M/' "$ANDROID_AVD_HOME/test.avd/config.ini"
          disable-animations: true
          emulator-options: -partition-size 1024 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash .github/scripts/playback-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A-S-Native-Music-Screen
          path: |
            native-smoke.png
            native-crash.log
            playback-smoke.log
            media-session.txt
          if-no-files-found: ignore
