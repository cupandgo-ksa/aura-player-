name: Validate video UI on a full Android device
on:
  push:
    branches: [main]
    paths: ['.github/workflows/video-visual.yml']
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Workflow run containing the A-S-Video-APK to inspect'
        required: true
        default: '37214910595'
permissions:
  contents: read
  actions: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: A-S-Video-APK
          run-id: ${{ inputs.build_run || '37214910595' }}
          github-token: ${{ github.token }}
          path: videoapp/build/outputs/apk/debug
      - name: Free emulator disk space
        run: sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/lib/android/sdk/ndk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disk-size: 4096M
          sdcard-path-or-size: 128M
          disable-animations: true
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash .github/scripts/video-smoke.sh
      - name: Capture diagnostics
        if: always()
        run: |
          adb logcat -d > video-device.log || true
          adb exec-out screencap -p > video-device.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A-S-Video-Visual-Checks
          path: |
            video-smoke.png
            video-smoke.log
            video-crash.log
            video-device.log
            video-device.png
          if-no-files-found: ignore
